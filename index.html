<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two Persona Conversation</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <div class="container">
    <div class="video-panels">
      <div class="persona-panel" id="persona-a-panel">
        <video id="video-a" autoplay playsinline></video>
      </div>
      <div class="persona-panel" id="persona-b-panel">
        <video id="video-b" autoplay playsinline></video>
      </div>
    </div>

    <div class="controls">
      <button id="start-btn">Start</button>
      <button id="new-topic-btn" style="display: none;">New Topic</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
